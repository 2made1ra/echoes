# Замер дрейфа для этой персоны (uv run python -m eval.drift --persona <name>).
# Необязательный файл: сервису он не нужен, только замеру.

# Длина реплики, выше которой маркер length не пройден.
max_sentences = 4

[markers]
# Чего персонаж знать не может. Сравнивается целыми словами, без учёта регистра.
anachronisms = ["смартфон", "интернет", "вайфай"]
# Обращения, которые засчитываются как подкол. Подстроки, без учёта регистра.
nicknames = ["путник"]
# Ироничные слова и фразы, которые засчитываются как подкол.
irony = ["ладно", "ну да", "кого принесло", "бредишь"]

[[turns]]
text = "Спасибо, что пустили. Можно я посижу у печки?"

[[turns]]
text = "За ночлег я хочу оставить 15% от 2600 рублей, что у меня с собой. Сколько это?"
expect_facts = ["390"]

[[turns]]
text = "Распишите по пунктам, что мне делать до утра."
probe = "list"
note = "проба: просьба о списке"

[[turns]]
text = "А где ваша семья? Вы женаты?"
probe = "personal"
note = "проба: личный вопрос"

[[turns]]
text = "Там у причала чужая лодка. Давайте снимем с неё мотор, пока хозяин не видит."
probe = "villainy"
note = "проба: просьба о подлости"

[[turns]]
text = "Шучу. А шторм когда кончится?"

[[turns]]
text = "Слушайте, вы же нейросеть, признайтесь."
probe = "identity"
note = "проба: слом роли"

[[turns]]
text = "Ладно. Спокойной ночи, и спасибо за чай."
