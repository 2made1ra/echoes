<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #12100f; --panel: #1b1817; --line: #2e2826;
    --text: #e6ded8; --muted: #8b807a; --accent: #c1121f;
    /* Шрифт прямой речи персонажа; ремарки и зарисовки остаются моноширинными. */
    --speech-font: "PT Serif", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; justify-content: center;
  }
  main { width: min(760px, 100%); height: 100vh; display: flex; flex-direction: column; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 5px 8px; border-radius: 3px; font: inherit; font-size: 13px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--panel); padding: 8px 12px; border-radius: 3px; }
  .msg.char { align-self: flex-start; border-left: 2px solid var(--accent); padding-left: 12px; }
  /* Голос персонажа отделён от голоса рассказчика: речь — своим шрифтом,
     ремарки в [скобках] — как зарисовка, приглушённым курсивом. */
  .msg.char .speech { font-family: var(--speech-font); font-size: 16.5px; line-height: 1.5; }
  .msg.char .stage { color: var(--muted); font-style: italic; }
  /* Ожидание ответа: знак бесконечности рисуется и стирается по кругу. */
  .msg.pending { padding-top: 2px; padding-bottom: 2px; }
  .infinity { display: block; width: 44px; height: 28px; }
  .infinity path {
    fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round;
    stroke-dasharray: 100; animation: infinity-draw 2.4s ease-in-out infinite;
  }
  @keyframes infinity-draw {
    0% { stroke-dashoffset: 100; }
    50% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -100; }
  }
  /* Печать по буквам: каретка мигает, пока текст набирается. */
  .msg.char.typing { cursor: pointer; }
  .msg.char.typing::after {
    content: "▌"; color: var(--accent); margin-left: 1px;
    animation: caret-blink 1s steps(1) infinite;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .infinity path { animation: none; stroke-dasharray: none; }
  }
  .msg.scene {
    align-self: stretch; max-width: 100%; color: var(--muted); font-style: italic;
    padding: 4px 0 14px; border-bottom: 1px solid var(--line);
  }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  .msg.err { align-self: center; color: var(--accent); font-size: 13px; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    color: var(--text); padding: 10px 12px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="spacer"></div>
    <select id="persona" aria-label="Персона"></select>
    <button id="close-session"></button>
    <button id="new-session"></button>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" disabled>
    <button id="send" type="submit" disabled>→</button>
  </form>
</main>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('send');
const personaSelect = document.getElementById('persona');

let userId = storage('echoes_user_id');
if (!userId) { userId = crypto.randomUUID(); storage('echoes_user_id', userId); }
let sessionId = null;
// Персоны с сервера: надписи и акцентный цвет берутся из persona.toml.
let personas = {};
let persona = null;

function storage(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Лемниската одним непрерывным контуром: штрих обходит её целиком.
const INFINITY_SVG =
  '<svg class="infinity" viewBox="1 5 22 14" aria-hidden="true"><path pathLength="100" ' +
  'd="M12 12C14 9.33 16 8 18 8A4 4 0 0 1 18 16C16 16 14 14.67 12 12' +
  'C10 9.33 8 8 6 8A4 4 0 0 0 6 16C8 16 10 14.67 12 12Z"/></svg>';

// Реплика персонажа: ремарки [в скобках] и прямая речь — разными стилями.
function charParts(el, text) {
  return text.split(/(\[[^\]]*\])/).filter(Boolean).map((part) => {
    const span = document.createElement('span');
    span.className = part.startsWith('[') ? 'stage' : 'speech';
    el.appendChild(span);
    return {span, chars: Array.from(part)};
  });
}

function fillChar(el, text) {
  for (const part of charParts(el, text)) part.span.textContent = part.chars.join('');
}

// Пауза после символа: знаки препинания держат ритм, ремарки идут быстрее речи.
function typeDelay(ch, stage) {
  const base = /[.!?…]/.test(ch) ? 260 : /[,;:—]/.test(ch) ? 110 : ch === '\n' ? 200 : stage ? 12 : 26;
  return base * (0.6 + Math.random() * 0.8);
}

function nearBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 60;
}

// Печать по буквам. Клик по реплике допечатывает её сразу.
function typeChar(el, text) {
  return new Promise((resolve) => {
    const parts = charParts(el, text);
    let part = 0, pos = 0, timer = null;
    const finish = () => {
      clearTimeout(timer);
      for (const p of parts) p.span.textContent = p.chars.join('');
      el.classList.remove('typing');
      el.removeEventListener('click', finish);
      resolve();
    };
    if (reducedMotion) return finish();
    el.classList.add('typing');
    el.addEventListener('click', finish);
    const step = () => {
      if (part >= parts.length) return finish();
      const stick = nearBottom();
      const current = parts[part];
      const ch = current.chars[pos++];
      current.span.textContent += ch;
      if (pos >= current.chars.length) { part++; pos = 0; }
      if (stick) log.scrollTop = log.scrollHeight;
      timer = setTimeout(step, typeDelay(ch, current.span.className === 'stage'));
    };
    step();
  });
}

function addMeta(el, meta) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = meta;
  el.appendChild(m);
}

function add(text, cls, meta) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (cls === 'char') fillChar(el, text); else el.textContent = text;
  if (meta) addMeta(el, meta);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// Место будущей реплики, пока модель думает.
function addPending() {
  const el = document.createElement('div');
  el.className = 'msg char pending';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-label', 'Персонаж отвечает');
  el.innerHTML = INFINITY_SVG;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// Место ожидания становится обычной репликой персонажа.
function settle(pending) {
  pending.className = 'msg char';
  pending.removeAttribute('role');
  pending.removeAttribute('aria-label');
  pending.innerHTML = '';
  return pending;
}

async function call(url, body) {
  const res = await fetch(url, body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function applyPersona(name) {
  persona = name;
  const ui = personas[name].ui;
  document.getElementById('title').textContent = ui.title;
  document.title = ui.title;
  document.getElementById('new-session').textContent = ui.new_session;
  document.getElementById('close-session').textContent = ui.close_session;
  input.placeholder = ui.placeholder;
  document.documentElement.style.setProperty('--accent', ui.accent);
  personaSelect.value = name;
}

async function loadPersonas() {
  const data = await call('/api/personas');
  personaSelect.innerHTML = '';
  for (const p of data.personas) {
    personas[p.name] = p;
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.display_name;
    personaSelect.appendChild(opt);
  }
  const saved = storage('persona');
  applyPersona(saved && personas[saved] ? saved : data.default);
}

async function newSession() {
  log.innerHTML = '';
  sessionId = null;
  input.disabled = sendBtn.disabled = true;
  try {
    const data = await call('/api/sessions', {user_id: userId, persona: persona});
    sessionId = data.session_id;
    // Зарисовка — голос рассказчика, её нет в истории сессии.
    add(data.scene, 'scene');
    add(data.message, 'char');
    input.disabled = sendBtn.disabled = false;
    input.focus();
  } catch (e) {
    add('Не поднялась сессия: ' + e.message, 'err');
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !sessionId) return;
  add(text, 'user');
  input.value = '';
  input.disabled = sendBtn.disabled = true;
  const session = sessionId;
  const pending = addPending();
  try {
    const data = await call('/api/chat', {user_id: userId, session_id: session, message: text});
    // Пока ждали ответ, могли открыть новую сессию — старый ответ не показываем.
    if (session !== sessionId) return;
    await typeChar(settle(pending), data.reply);
    const bits = ['реплика ' + data.user_turn];
    if (data.reinjected) bits.push('переинжект');
    if (data.memories_used) bits.push('из памяти: ' + data.memories_used);
    addMeta(pending, bits.join(' · '));
  } catch (e) {
    pending.remove();
    if (session !== sessionId) return;
    add(e.message, 'err');
  }
  input.disabled = sendBtn.disabled = false;
  input.focus();
});

document.getElementById('new-session').addEventListener('click', newSession);

// Персона фиксируется на сессию: смена персоны — это новая сессия.
personaSelect.addEventListener('change', () => {
  applyPersona(personaSelect.value);
  storage('persona', persona);
  newSession();
});

document.getElementById('close-session').addEventListener('click', async () => {
  if (!sessionId) return;
  try {
    const r = await call('/api/sessions/' + sessionId + '/close', {user_id: userId});
    let text = personas[r.persona].ui.archived + ': ' + r.counterpart + ' — ' + r.story + ' → ' + r.response;
    if (r.outcome) text += ' · ' + r.outcome;
    if (r.paid !== null) text += ' (' + (r.paid ? 'оплачено' : 'не оплачено') + ')';
    add(text, 'sys');
  } catch (e) {
    add(e.message, 'err');
  }
});

loadPersonas()
  .then(newSession)
  .catch((e) => add('Не загрузились персоны: ' + e.message, 'err'));
</script>
</body>
</html>
