<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат</title>
<style>
  :root {
    --bg: #12100f; --panel: #1b1817; --line: #2e2826;
    --text: #e6ded8; --muted: #8b807a; --accent: #c1121f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; justify-content: center;
  }
  main { width: min(760px, 100%); height: 100vh; display: flex; flex-direction: column; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 5px 8px; border-radius: 3px; font: inherit; font-size: 13px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--panel); padding: 8px 12px; border-radius: 3px; }
  .msg.char { align-self: flex-start; border-left: 2px solid var(--accent); padding-left: 12px; }
  .msg.scene {
    align-self: stretch; max-width: 100%; color: var(--muted); font-style: italic;
    padding: 4px 0 14px; border-bottom: 1px solid var(--line);
  }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  .msg.err { align-self: center; color: var(--accent); font-size: 13px; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    color: var(--text); padding: 10px 12px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="spacer"></div>
    <select id="persona" aria-label="Персона"></select>
    <button id="close-session"></button>
    <button id="new-session"></button>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" disabled>
    <button id="send" type="submit" disabled>→</button>
  </form>
</main>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('send');
const personaSelect = document.getElementById('persona');

let userId = storage('echoes_user_id');
if (!userId) { userId = crypto.randomUUID(); storage('echoes_user_id', userId); }
let sessionId = null;
// Персоны с сервера: надписи и акцентный цвет берутся из persona.toml.
let personas = {};
let persona = null;

function storage(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}

function add(text, cls, meta) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    el.appendChild(m);
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function call(url, body) {
  const res = await fetch(url, body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function applyPersona(name) {
  persona = name;
  const ui = personas[name].ui;
  document.getElementById('title').textContent = ui.title;
  document.title = ui.title;
  document.getElementById('new-session').textContent = ui.new_session;
  document.getElementById('close-session').textContent = ui.close_session;
  input.placeholder = ui.placeholder;
  document.documentElement.style.setProperty('--accent', ui.accent);
  personaSelect.value = name;
}

async function loadPersonas() {
  const data = await call('/api/personas');
  personaSelect.innerHTML = '';
  for (const p of data.personas) {
    personas[p.name] = p;
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.display_name;
    personaSelect.appendChild(opt);
  }
  const saved = storage('persona');
  applyPersona(saved && personas[saved] ? saved : data.default);
}

async function newSession() {
  log.innerHTML = '';
  sessionId = null;
  input.disabled = sendBtn.disabled = true;
  try {
    const data = await call('/api/sessions', {user_id: userId, persona: persona});
    sessionId = data.session_id;
    // Зарисовка — голос рассказчика, её нет в истории сессии.
    add(data.scene, 'scene');
    add(data.message, 'char');
    input.disabled = sendBtn.disabled = false;
    input.focus();
  } catch (e) {
    add('Не поднялась сессия: ' + e.message, 'err');
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !sessionId) return;
  add(text, 'user');
  input.value = '';
  input.disabled = sendBtn.disabled = true;
  try {
    const data = await call('/api/chat', {user_id: userId, session_id: sessionId, message: text});
    const bits = ['реплика ' + data.user_turn];
    if (data.reinjected) bits.push('переинжект');
    if (data.memories_used) bits.push('из памяти: ' + data.memories_used);
    add(data.reply, 'char', bits.join(' · '));
  } catch (e) {
    add(e.message, 'err');
  }
  input.disabled = sendBtn.disabled = false;
  input.focus();
});

document.getElementById('new-session').addEventListener('click', newSession);

// Персона фиксируется на сессию: смена персоны — это новая сессия.
personaSelect.addEventListener('change', () => {
  applyPersona(personaSelect.value);
  storage('persona', persona);
  newSession();
});

document.getElementById('close-session').addEventListener('click', async () => {
  if (!sessionId) return;
  try {
    const r = await call('/api/sessions/' + sessionId + '/close', {user_id: userId});
    let text = personas[r.persona].ui.archived + ': ' + r.counterpart + ' — ' + r.story + ' → ' + r.response;
    if (r.outcome) text += ' · ' + r.outcome;
    if (r.paid !== null) text += ' (' + (r.paid ? 'оплачено' : 'не оплачено') + ')';
    add(text, 'sys');
  } catch (e) {
    add(e.message, 'err');
  }
});

loadPersonas()
  .then(newSession)
  .catch((e) => add('Не загрузились персоны: ' + e.message, 'err'));
</script>
</body>
</html>
